# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploys the API as a Docker web service, backed by a managed Postgres
# and (optionally) a managed Redis. Import this repo at render.com/deploy
# and fill in the `sync: false` values in the dashboard - they're secrets
# and provider keys that don't belong committed to source control.

databases:
  - name: nimbus-db
    plan: free
    databaseName: nimbus
    user: nimbus

services:
  - type: redis
    name: nimbus-redis
    plan: free
    ipAllowList: []

  - type: web
    name: nimbus-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nimbus-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      # Set to the deployed Vercel URL(s), comma-separated if more than one.
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: no-reply@example.com
      - key: RESET_PASSWORD_URL_BASE
        sync: false
