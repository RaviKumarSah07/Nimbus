name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_ci?schema=public
      TEST_DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_ci?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations
        run: npm run prisma:migrate:deploy

      - name: Lint API
        run: npm run lint --workspace=apps/api

      - name: Lint web
        run: npx next lint
        working-directory: apps/web

      - name: Typecheck
        run: |
          npm run typecheck --workspace=packages/shared
          npm run typecheck --workspace=packages/db
          npm run typecheck --workspace=apps/api
          npm run typecheck --workspace=apps/web

      - name: Run API test suite
        run: npm run test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web
